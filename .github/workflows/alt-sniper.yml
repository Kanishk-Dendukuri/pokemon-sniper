# Alt sniper: find the lots worth bidding on in the Alt Auction about to close,
# and bid on them all at once, late in the night.
#
# The same pipeline as fanatics-sniper.yml, at alt.xyz: see
# scripts/sniper-core.ts for the tier table, the sales-history rule and the
# hold, scripts/alt-sniper.ts for the scan, and scripts/alt-bidder.ts for the
# session and the bid ladder. One difference from Fanatics: there is no chase
# list here. An Alt Auction holds a thousand or so PSA/CGC 7–10 Pokémon lots
# and every one of them is a candidate; the sales rule and the tier table
# decide the rest.
#
# The fire is the "fire after" box: minutes after extended bidding opens at
# 9:00 PM ET, 100 by default, so 10:40 PM. Alt extends the whole auction
# together — any bid on any lot pushes every lot's close out by the window of
# the hour (two minutes until 9:30, one until 10:00, 30 seconds until 10:30,
# 15 from then on), and it ends the moment a window passes with no bid
# anywhere. Nothing closes early, and the night runs long: the 26 auctions to
# 10 Sep 2026 ended between 12:03 and 2:30 AM, bar one holiday-week Friday at
# 10:45 PM. So the later the bids go on, the less of the night an outbid
# bidder has to answer in; 10:40 is late with the auction still safely open.
# Should the auction's clock read seconds from its end before then, the run
# fires at once rather than hold through the close.
#
# Which auction. Alt keeps two or three open at once, a week apart, and all of
# them take bids. A run scans only the auction closing first — the one whose
# extended bidding the fire above is timed to — and leaves the cycle behind it
# alone: a bid put on next week's lots at tonight's fire would stand there all
# week for anyone to answer. To scan a different one, run it locally with
# --auction="Sep 04" (an auction's id or any part of its name); there is no box
# for it here, since workflow_dispatch allows ten and these are the ten.
#
# The tier table — what to bid on a card by what it is worth — is typed into
# the run, one line per grader, in dollars of the card's bid basis (the value
# basis box, the second-lowest of its five recent sales by default):
# "$7.5-8: flat $5, $8-10: market - $3, $10-90: 85%, $90-450: 80%" bids a flat
# $5 on a card worth $7.50–8, $3 under on one worth $8–10, 85% all-in of one
# worth $10–90 and 80% of one worth $90–450; under $7.50 and over $450 nothing is
# bid. The boxes' defaults are the code's own (DEFAULT_TIERS); the sold-report
# workflow is where a new line is tried against past auctions before it goes
# here. A line that cannot be read stops the run before anything is scanned.
#
# The value basis box is what a card is worth, before any percentage touches
# it: the sniper looks up the card's recent sales and boils them down to one
# price, and every share in the tier table multiplies that. "2nd lowest" is the
# default and what the tables were fitted on — the lowest sale with the worst
# comp thrown out. "lowest" is the most cautious, "average of the 3 lowest" and
# "drop the lowest and the highest, average the rest" smooth a noisy card out,
# "median" and "average" bid near what the card really goes for. The sales-rule
# box says how many sales are looked at and how old the oldest may be ("5 sales
# in 60 days"): it gates the lot as well as feeding the basis, so a wider window
# lets more lots through and prices them off older sales at once. Try a change
# in the sold-report workflow — it takes the same two boxes — before a table
# fitted on one basis is bid with another.
#
# The budget box is a ceiling, not a target: the most the run may hold at once,
# all-in. The bids go on down the list, best lot first, as far as it reaches.
# How many lots are won is the tier table's and the per-card cap's doing.
#
# Nothing is bid unless the "live" box is ticked. Unticked, the run does
# everything except send a bid and needs no Alt account at all. The bid
# request itself was checked against what alt.xyz sends on 2026-09-07; what
# has never run signed in is the rest of the account side, so tick the box
# only after a --quote-only run has proved the session and the bid read.
#
# A live run needs an Alt session token, pasted into the token box when the
# run is started or kept in the ALT_SESSION_TOKEN secret. Mint one with:
# npm run sniper:alt -- --export-session (after signing in once by hand with
# --login). A typed-in value is recorded on the run's page like any other
# input, where a secret is not.
#
# It reads nothing from the database and writes nothing back: the only cap on
# a card is the "max copies per card" box — four lots of it winning or won in
# this auction, whatever their grade or grader, counted by the run itself. An
# outbid copy makes room for the next one down. The one artifact is
# alt-bids.csv; the Actions log is the record of every bid, and the run
# summary is the page.
#
# There is no schedule: every run is started by hand. Start it around 8:30 PM
# ET on the Thursday: pricing takes a quarter of an hour, the bids go on at
# 10:40, and the six-hour cap then reaches 2:30 AM, past every end but one
# since March. A run cut off at the cap leaves its bids standing; only the
# tally is lost.
name: Alt sniper

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Ceiling on what the run may hold at once, all-in (hammer + 20% premium); not a target"
        type: string
        default: "10000"
      live:
        description: "Place real bids (unticked: log only, nothing sent)"
        type: boolean
        default: false
      count_existing_bids:
        description: "Charge bids already on the account to the budget (unticked: the budget is on top of them)"
        type: boolean
        default: false
      psa_tiers:
        description: "PSA tier table, in dollars of the bid basis (see the value basis box): from-to: flat $N | market - $N | N%"
        type: string
        default: "$7.5-8: flat $5, $8-10: market - $3, $10-90: 85%, $90-450: 80%"
      cgc_tiers:
        description: "CGC tier table, the same way"
        type: string
        default: "$7.5-8: flat $5, $8-10: market - $3, $10-90: 77%, $90-450: 70%"
      value_basis:
        description: "How the recent sales become the one price the tier tables' percentages multiply"
        type: choice
        default: "2nd lowest"
        options:
          - "lowest"
          - "2nd lowest"
          - "3rd lowest"
          - "average of the 2 lowest"
          - "average of the 3 lowest"
          - "drop the lowest and the highest, average the rest"
          - "median"
          - "average"
      sales_rule:
        description: "How many recent sales a price is worked from, and how old the oldest of them may be"
        type: string
        default: "5 sales in 60 days"
      max_copies_per_card:
        description: "Most lots of one card to hold at once, counted across every grade and both graders"
        type: string
        default: "4"
      fire_after_minutes:
        description: "Minutes after extended bidding opens (9:00 PM ET) to put the bids on (or sooner, the moment the auction reads seconds from its end)"
        type: string
        default: "100"
      token:
        description: "Alt session token (blank: the ALT_SESSION_TOKEN secret)"
        type: string
        default: ""

# One run at a time: two would collide on the same Card Uploader account's
# Previous Batches page, and count the same budget twice.
concurrency:
  group: alt-sniper
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A live run lasts as long as it holds an open bid: through extended
    # bidding on a Thursday evening. 360 is the ceiling GitHub-hosted runners
    # allow, so the job is given all of it. A run cut off there leaves its
    # bids standing; the next run finds them on the account and leaves them
    # alone.
    timeout-minutes: 360

    steps:
      # A typed-in token is not a secret as far as Actions is concerned, so it is
      # masked here before anything can echo it, and the run is stopped now —
      # rather than after a scan — if a live run has no way in.
      - name: Check the way in to Alt
        env:
          TYPED: ${{ inputs.token }}
          STORED: ${{ secrets.ALT_SESSION_TOKEN }}
        run: |
          if [ -n "$TYPED" ]; then echo "::add-mask::$TYPED"; fi
          if [ "${{ inputs.live }}" = "true" ] && [ -z "$TYPED" ] && [ -z "$STORED" ]; then
            echo "::error::A live run needs an Alt session. Sign in locally with: npm run sniper:alt -- --login, then npm run sniper:alt -- --export-session — and paste the token into the token box, or store it as the ALT_SESSION_TOKEN secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium is a 150 MB download every run without this. The cache is keyed
      # on the lock file, so a Playwright upgrade fetches the browser it wants;
      # the system libraries are cheap and installed either way.
      - name: Cache Playwright's Chromium
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Left alone, the dispatch form's own defaults stand: a plan under a
      # $10,000 ceiling, no
      # bids sent, no Alt account touched.
      - name: Scan, price and bid
        run: >-
          npm run sniper:alt --
          --budget=${{ inputs.budget || '10000' }}
          ${{ inputs.live && '--live' || '' }}
          ${{ inputs.count_existing_bids && '--count-existing-bids' || '' }}
        env:
          CARDUPLOADER_EMAIL: ${{ secrets.CARDUPLOADER_EMAIL }}
          CARDUPLOADER_PASSWORD: ${{ secrets.CARDUPLOADER_PASSWORD }}
          # Only a live run needs this: the stytch_session cookie of a signed-in
          # browser, which the page's own sign-in SDK turns into the short-lived
          # token every request carries. Typed into the run wins over the
          # stored secret.
          ALT_SESSION_TOKEN: ${{ inputs.token || secrets.ALT_SESSION_TOKEN }}
          # The tier tables, through the environment rather than the command
          # line: the lines carry "$" and spaces, which a shell would eat.
          # Blank means the code's own defaults.
          TIERS_PSA: ${{ inputs.psa_tiers }}
          TIERS_CGC: ${{ inputs.cgc_tiers }}
          # How a card's price is worked out from its sales: the sales rule —
          # how many, how recent — and the basis, which of them (or what blend
          # of them) the tier tables' percentages multiply. Blank means the
          # code's own defaults: the second-lowest of five sales inside 60 days.
          VALUE_BASIS: ${{ inputs.value_basis }}
          SALES_RULE: ${{ inputs.sales_rule }}
          # The per-card cap, the same way. Blank means the code's own default.
          MAX_COPIES_PER_CARD: ${{ inputs.max_copies_per_card }}
          # When the bids go on, in minutes after extended bidding opens.
          # Blank means the venue's own default.
          FIRE_AFTER_MINUTES: ${{ inputs.fire_after_minutes }}

      - name: Publish summary
        if: always()
        run: cat alt-sniper-runs/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # The bid list is the one file worth keeping: every lot worth a bid, what
      # was bid, how it ended, and what a won lot cost against its market value.
      - name: Upload the bid list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alt-bids
          path: alt-sniper-runs/*/alt-bids.csv
          if-no-files-found: ignore
          retention-days: 30
