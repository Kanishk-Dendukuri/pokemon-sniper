# Fanatics Collect sniper: find the lots worth bidding on, and bid on them all
# at once, three minutes before the quiet ones close.
#
# One pipeline. It walks the Pokémon lots in the Weekly Auction about to close
# — later auctions are left alone — prices them by cert through Card Uploader a
# batch at a time, and holds: nothing is bid while the list is priced. A bid
# placed hours early is one the other bidder has hours to answer (13 Sep: 433
# bids from 4 PM, 189 beaten by someone coming back later, 28 won). From half
# an hour before the fire the run re-scans the auction every five minutes and
# notes which lots the room has already taken past our max; at the fire it
# quotes the rest and bids on all of it, eight lots at a time. Then it watches
# the bids it holds until the auction is over.
#
# The fire is the "fire after" box: minutes after extended bidding opens at
# 7:00 PM PT, 27 by default, so 7:27. Fanatics closes lots one by one — a lot
# nobody bids on between 7:00 and 7:30 closes at 7:30 sharp; after that a lot
# closes five minutes after its last bid, and after 8:00 one minute after —
# so 7:27 puts our max on the quiet lots three minutes before they close, and
# gives the other bidder on a fought-over lot the five-minute window that
# follows rather than an evening.
#
# What is priced. Every PSA lot in the auction, whatever its title says, and
# the CGC lots whose titles are on the chase list — the CGC end of a Weekly
# Auction is full of $6 energies, insert cards, sticker sheets and Old Maid
# decks, and those are blocked outright besides. A lot also needs a card
# number in its title (186/196, #186, SWSH284, or the word promo), and a CGC
# slab needs a number grade rather than AUTHENTIC. Grades run 1–10 in half
# steps now, not 7–10: a $12 card in a PSA 4 is priced off PSA 4 comps like
# any other, and the tier table decides whether it is worth a bid.
#
# The order the bids go on in, which is the order the budget is spent in: the
# full arts first, then everything else, cheapest first inside each — a
# ceiling walked cheapest-first buys the most lots it can.
#
# See scripts/sniper-core.ts for the chase list, the tier table, the
# sales-history rule and the hold, scripts/sniper-book.ts for the ceiling, the
# fire and the guard that keeps every bid at or under the lot's max, and
# scripts/fanatics-sniper.ts and scripts/fanatics-bidder.ts for the scan, the
# session and the bid ladder. The same pipeline runs at Alt: alt-sniper.yml.
#
# Firing early. The box takes a negative — "-30", or "30 before" — and the
# bids then go on that long before extended bidding opens, rather than after.
# It buys the lots that are gone before extended bidding starts at all, and a
# run that does not have to still be alive hours later. What it costs is the
# thing the late fire was built to avoid: a bid standing from before the open
# is one every other bidder has until the close to answer, and on 13 Sep 433
# bids placed from 4 PM had 189 of them beaten by someone coming back later.
# A fire time already past when the run starts is not an error — the bids go
# on as soon as the list is priced, and the run says so.
#
# The tier table — what to bid on a card by what it is worth — is typed into
# the run, one line per grader, in dollars of the card's bid basis (the value
# basis box, the second-lowest of its five recent sales by default). The short
# form is unchanged: "$10-90: 85%, $90-450: 80%" pays 85% all-in of a card
# worth $10–90 and 80% of one worth $90–450, and nothing outside that.
#
# Both boxes start empty, and empty means that grader is not bid on. There is
# no default table and there is not meant to be one: a table nobody typed is a
# table nobody chose, and the next thing it does is spend money. A live run
# with both boxes empty is stopped before it scans anything.
#
# A band may also price its own way, which is the point of the long form —
# the cheap end of a table and the dear end rarely want the same evidence.
# These two lines are the ones fitted on 2026-09-20; paste them in, or type
# your own:
#
#   PSA  grades 1-10, $1-30: 95% of average of the 3 lowest in 5 sales/60 days, min 3, round up, else 90% of alt value, $30-100: 85% of 2nd lowest in 3 months, else 80% of alt value, $100-500: 75% of lowest in 2 months, $500-1000: 60% of lowest in 2 months, min 5
#   CGC  grades 1-10, $1-15: 90% of average of the 3 lowest, min 3, $15-50: 70% of average of the 3 lowest, min 3
#
# After the rule a band may name, in this order and any of them left out:
#   of <basis>     which sale the percentage multiplies — "of 2nd lowest",
#                  "of average of the 3 lowest", "of lowest", "of median",
#                  or "of alt value" (Card Uploader's estimate for the cert,
#                  which is there whether the card has sold lately or not)
#   in <window>    how far back it looks — "in 3 months", "in 60 days",
#                  "in 5 sales/2 months"
#   min <n>        how few sales will still do; below that the fallback fires
#   round up       the bid is a whole dollar rounded up rather than down,
#                  which costs the odd dollar over the rule and wins the lot
#                  that a sixty-cent shortfall would have lost
#   else <n>% of alt value   what to bid when the sales are not there;
#                  "else none" refuses instead, and so does a band that says
#                  nothing — a bid priced off evidence the band asked for and
#                  did not get is a bid at a made-up number
#
# Whatever a band does not name is the run's own value-basis and sales-rule
# boxes. The band is picked once, on the widest net the whole table casts, and
# the band it lands in then prices the card its own way — so a table whose
# bands disagree about the evidence still has one answer for which band a card
# is in. With too few sales for even that, the card's alt value picks the band.
#
# The line may open with "grades 1-10" to say which grades of that grader to
# scan; it rides here because a dispatch form takes ten inputs and this is the
# grader's own line already. Grades run 1–10 in half steps, and a $12 card in a
# PSA 4 is priced off PSA 4 comps like any other.
#
# The sold-report workflow is where a new line is tried against past auctions
# before it goes here; it reads the same long form, except that it never falls
# back on the alt value — that figure is today's, not the one the sniper would
# have had months ago. A line that cannot be read stops the run before
# anything is scanned, naming the band it could not read.
#
# The value basis box is what a card is worth, before any percentage touches
# it: the sniper looks up the card's recent sales and boils them down to one
# price, and every share in the tier table multiplies that. "2nd lowest" is the
# default and what the tables were fitted on — the lowest sale with the worst
# comp thrown out. "lowest" is the most cautious, "average of the 3 lowest" and
# "drop the lowest and the highest, average the rest" smooth a noisy card out,
# "median" and "average" bid near what the card really goes for. The sales-rule
# box says how many sales are looked at and how old the oldest may be ("5 sales
# in 60 days"): it gates the lot as well as feeding the basis, so a wider window
# lets more lots through and prices them off older sales at once. Try a change
# in the sold-report workflow — it takes the same two boxes — before a table
# fitted on one basis is bid with another.
#
# The budget box is a ceiling, not a target: the most the run may hold at once,
# all-in. The bids go on down the list, best lot first, as far as it reaches.
# How many lots are won is the tier table's and the per-card cap's doing.
#
# Nothing is bid unless the "live" box is ticked. Unticked, the run does
# everything except send a bid, and needs no Fanatics account at all.
#
# A live run needs a Fanatics session token, pasted into the token box when the
# run is started or kept in the FANATICS_REFRESH_TOKEN secret. Mint one with:
# npm run sniper -- --export-session. Note that a typed-in value is recorded on
# the run's page like any other input, where a secret is not.
#
# It reads nothing from the database and writes nothing back: the only cap on
# a card is the "max copies per card" box — four lots of it winning or won in
# this auction, whatever their grade or grader, counted by the run itself. An
# outbid copy makes room for the next one down. The one artifact is
# fanatics-bids.csv; the Actions log is the record of every bid, and the run
# summary is the page.
#
# There is no schedule: every run is started by hand. Start it around 4 PM PT
# on the Sunday: pricing the chase list takes about an hour, the bids go on at
# 7:27, and the lots are all closed by about 8:30.
name: Fanatics sniper

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Ceiling on what the run may hold at once, all-in (hammer + 20% premium); not a target. A grader may have a purse of its own under it: "10000, PSA 6000, CGC 1500"'
        type: string
        default: "10000"
      live:
        description: "Place real bids (unticked: log only, nothing sent)"
        type: boolean
        default: false
      count_existing_bids:
        description: "Charge bids already on the account to the budget (unticked: the budget is on top of them)"
        type: boolean
        default: false
      psa_tiers:
        description: 'PSA tier table. Short form "$10-90: 85%"; long form lets a band name its own basis, window, minimum, rounding and fallback. May open with "grades 1-10". LEAVE BLANK AND NO PSA LOT IS BID ON'
        type: string
        default: ""
      cgc_tiers:
        description: 'CGC tier table, the same way. LEAVE BLANK AND NO CGC LOT IS BID ON'
        type: string
        default: ""
      value_basis:
        description: "How the recent sales become the one price the tier tables' percentages multiply, for any band that does not say for itself"
        type: choice
        default: "2nd lowest"
        options:
          - "lowest"
          - "2nd lowest"
          - "3rd lowest"
          - "average of the 2 lowest"
          - "average of the 3 lowest"
          - "drop the lowest and the highest, average the rest"
          - "median"
          - "average"
      sales_rule:
        description: 'How many recent sales a price is worked from and how old the oldest may be, for any band that does not say for itself; "5 sales in 60 days, at least 3" settles for fewer'
        type: string
        default: "5 sales in 60 days"
      max_copies_per_card:
        description: 'Most lots of one card to hold at once, across every grade and both graders. A grader may have a cap of its own, counted over its own copies: "6, CGC 4"'
        type: string
        default: "4, CGC 4"
      fire_after_minutes:
        description: 'Minutes after extended bidding opens (7:00 PM PT) to put the bids on. Negative fires before it instead: "-30" or "30 before"'
        type: string
        default: "27"
      token:
        description: "Fanatics session token (blank: the FANATICS_REFRESH_TOKEN secret)"
        type: string
        default: ""

# One run at a time: two would collide on the same Card Uploader account's
# Previous Batches page, and count the same budget twice.
concurrency:
  group: fanatics-sniper
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A live run lasts as long as it holds an open bid: through extended
    # bidding on a Sunday evening, which can be hours. 360 is the ceiling
    # GitHub-hosted runners allow, so the job is given all of it. A run cut off
    # there leaves its bids standing; the next run finds them on the account
    # and leaves them alone.
    timeout-minutes: 360

    steps:
      # A typed-in token is not a secret as far as Actions is concerned, so it is
      # masked here before anything can echo it, and the run is stopped now —
      # rather than after a two-minute scan — if a live run has no way in.
      - name: Check the way in to Fanatics
        env:
          TYPED: ${{ inputs.token }}
          STORED: ${{ secrets.FANATICS_REFRESH_TOKEN }}
        run: |
          if [ -n "$TYPED" ]; then echo "::add-mask::$TYPED"; fi
          if [ "${{ inputs.live }}" = "true" ] && [ -z "$TYPED" ] && [ -z "$STORED" ]; then
            echo "::error::A live run needs a Fanatics session. Mint one locally with: npm run sniper -- --export-session — then paste it into the token box, or store it as the FANATICS_REFRESH_TOKEN secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium is a 150 MB download every run without this. The cache is keyed
      # on the lock file, so a Playwright upgrade fetches the browser it wants;
      # the system libraries are cheap and installed either way.
      - name: Cache Playwright's Chromium
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Left alone, the dispatch form's own defaults stand: a plan under a
      # $10,000 ceiling, no
      # bids sent, no Fanatics account touched.
      - name: Scan, price and bid
        run: >-
          npm run sniper --
          --budget=${{ inputs.budget || '10000' }}
          ${{ inputs.live && '--live' || '' }}
          ${{ inputs.count_existing_bids && '--count-existing-bids' || '' }}
        env:
          CARDUPLOADER_EMAIL: ${{ secrets.CARDUPLOADER_EMAIL }}
          CARDUPLOADER_PASSWORD: ${{ secrets.CARDUPLOADER_PASSWORD }}
          # Only a live run needs this. A token is also the only way in here: a
          # runner has no screen, and Cloudflare will not draw the Fanatics
          # sign-in page for a headless browser, so an email and password
          # cannot be used. Mint one locally with: npm run sniper -- --export-session
          #
          # Typed into the run wins over the stored secret. Fanatics hands back
          # a fresh token every time one is used and the runner throws its copy
          # away, so typing this run's token in is the way to be sure it is the
          # live one; the secret is there for a run nobody is watching.
          FANATICS_REFRESH_TOKEN: ${{ inputs.token || secrets.FANATICS_REFRESH_TOKEN }}
          # The tier tables, through the environment rather than the command
          # line: the lines carry "$" and spaces, which a shell would eat.
          # Blank switches that grader off altogether — a run bids nothing it
          # was not given a table for.
          TIERS_PSA: ${{ inputs.psa_tiers }}
          TIERS_CGC: ${{ inputs.cgc_tiers }}
          # How a card's price is worked out from its sales: the sales rule —
          # how many, how recent — and the basis, which of them (or what blend
          # of them) the tier tables' percentages multiply. Blank means the
          # code's own defaults: the second-lowest of five sales inside 60 days.
          VALUE_BASIS: ${{ inputs.value_basis }}
          SALES_RULE: ${{ inputs.sales_rule }}
          # The per-card cap, the same way. Blank means the code's own default.
          MAX_COPIES_PER_CARD: ${{ inputs.max_copies_per_card }}
          # When the bids go on, in minutes after extended bidding opens.
          # Blank means the venue's own default.
          FIRE_AFTER_MINUTES: ${{ inputs.fire_after_minutes }}

      - name: Publish summary
        if: always()
        run: cat sniper-runs/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # The bid list is the one file worth keeping: every lot worth a bid, what
      # was bid, how it ended, and what a won lot cost against its market value.
      - name: Upload the bid list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanatics-bids
          path: sniper-runs/*/fanatics-bids.csv
          if-no-files-found: ignore
          retention-days: 30
