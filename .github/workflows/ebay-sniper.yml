# eBay sniper: scan the sellers' live auctions, price what is worth a bid, and
# say what it would bid — on this runner it never bids.
#
# The eBay sniper's real home is the PC it runs on round the clock. This
# workflow is for trying it from here: one scan, the prices, and the list of
# lots it would bid on — and, with the live box ticked and a session pasted
# in, the bids themselves.
#
# Three things to know before ticking that box.
#
# The bid goes through a signed-in browser, because eBay's bidding API is
# closed to new applications and its licence forbids a sniper outright. A
# runner has no session of its own, so one is exported from the machine that
# signed in: npm run sniper:ebay -- --export-session prints a line to paste
# into the session box. eBay ties a sign-in to the machine it was made on as
# well as to the cookie, and a session presented from a datacenter address is
# often challenged — if that happens it happens mid-bid, seconds before the
# close, and the lot is lost. The PC does not have this problem.
#
# The run keeps its state — what is scheduled, what is bid on, what is won and
# what the budget has left — in a file, and a runner starts empty. It is
# cached between runs below, but a cache is not a disk: if it misses, the run
# forgets what it won and the budget ceiling stops meaning anything. Set the
# win limit and a small budget when bidding from here.
#
# A job stops at six hours. eBay closes hard, with no extended bidding, so a
# run only has to live as long as the lots it armed — but anything closing
# after the job ends is simply missed.
#
# What it needs, as repository secrets: EBAY_CLIENT_ID and EBAY_CLIENT_SECRET
# (a developer.ebay.com production keyset — the sandbox keys will not do), the
# CARDUPLOADER_EMAIL / CARDUPLOADER_PASSWORD the other two snipers already use
# for the per-cert prices. No key is needed to read the slab labels — that is
# Tesseract, installed on the runner below — but none of these sellers publish
# a cert number anywhere, so without it nothing can be priced.
#
# The postcode box is required, for two reasons. eBay will not filter on
# Authenticity Guarantee at all unless the request says where the buyer is —
# it answers HTTP 400 — and postage is money out of the same budget as the
# hammer: the sniper takes the listing's own postage off what it bids, so
# hammer plus postage stays under the tier table's all-in. A calculated
# postage rate is quoted to this postcode; where eBay quotes none, the
# "unquoted postage" box stands in. Fill it in with the postcode the cards
# would ship to.
#
# The tier table, the value basis and the sales rule are the same boxes as
# fanatics-sniper.yml and alt-sniper.yml, and mean the same things — except
# that eBay charges the buyer no premium, so an all-in percentage here is a
# percentage of the hammer plus postage.
#
# A blank tier box means that grader is not bid on at all. It does not mean
# "the usual table": there is no default table anywhere, because a table
# nobody typed is a table nobody chose and the next thing it does is spend
# money. Fill one in and leave the other blank to buy PSA and not CGC, or the
# reverse; leave both blank and a live run is refused before it scans.
#
# A band may price its own way — its own basis, window, minimum, rounding and
# fallback, and "grades 7-10" at the head of the line to set the grades. See
# the header of fanatics-sniper.yml for the whole grammar and two lines worth
# pasting.
#
# The sellers are not a box. They are the four in DEFAULT_SELLERS, and the
# wider Authenticity Guarantee pool alongside them unless sellers-only is
# ticked; change the four in code or run it locally with --sellers.
name: eBay sniper

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Place real bids (unticked: plan only — scans, prices, says what it would bid, sends nothing)"
        type: boolean
        default: false
      token:
        description: "eBay session token (blank: the EBAY_SESSION_STATE secret). npm run sniper:ebay -- --export-session prints one"
        type: string
        default: ""
      zip:
        description: "Postcode the cards ship to, five digits — REQUIRED: eBay refuses the Authenticity Guarantee filter without one, and postage is quoted to it"
        type: string
        default: ""
      ocr_before:
        description: "Minutes before a lot closes to read its slab label — a single run only sees lots closing inside this window"
        type: string
        default: "240"
      budget:
        description: "Ceiling on what the run may spend, all-in (hammer + postage); the run ends when it is bought up to"
        type: string
        default: "10000"
      max_wins:
        description: "Lots to win before the run is over; 0 is as many as the budget stretches to"
        type: string
        default: "0"
      psa_tiers:
        description: "PSA tier table, in dollars of the bid basis: from-to: flat $N | market - $N | N%. BLANK OR 'none' = no PSA bids"
        type: string
        default: ""
      cgc_tiers:
        description: "CGC tier table, the same way. BLANK OR 'none' = no CGC bids"
        type: string
        default: ""
      sales_rule:
        description: "What counts as recent: how many sales are looked at and how old the oldest may be, e.g. 5 sales in 60 days"
        type: string
        default: "5 sales in 60 days"
      value_basis:
        description: "How those recent sales become the one price the tier tables' percentages multiply"
        type: choice
        default: "2nd lowest"
        options:
          - "lowest"
          - "2nd lowest"
          - "average of the 3 lowest"
          - "drop the lowest and the highest, average the rest"
          - "median"
          - "average"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A plan is one scan. A live run waits out the closes it armed, so it is
    # given the full 360 minutes a hosted runner allows.
    timeout-minutes: 360

    steps:
      # A typed-in session is not a secret as far as Actions is concerned, so
      # it is masked here before anything can echo it, and a live run with no
      # way in is stopped now rather than after a scan.
      - name: Check the keys and the way in to eBay
        env:
          ID: ${{ secrets.EBAY_CLIENT_ID }}
          SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TYPED: ${{ inputs.token }}
          STORED: ${{ secrets.EBAY_SESSION_STATE }}
        run: |
          if [ -n "$TYPED" ]; then echo "::add-mask::$TYPED"; fi
          if [ "${{ inputs.live }}" = "true" ] && [ -z "$TYPED" ] && [ -z "$STORED" ]; then
            echo "::error::A live run needs an eBay session. On the signed-in machine: npm run sniper:ebay -- --login, then npm run sniper:ebay -- --export-session — paste the line into the session box, or store it as the EBAY_SESSION_STATE secret."
            exit 1
          fi
          if [ -z "$ID" ] || [ -z "$SECRET" ]; then
            echo "::error::Set the EBAY_CLIENT_ID and EBAY_CLIENT_SECRET repository secrets — a developer.ebay.com production keyset."
            exit 1
          fi
          case "$ID$SECRET" in
            *SBX*) echo "::error::Those are sandbox keys and the sandbox has no real listings. Copy the Production App ID and Cert ID from developer.ebay.com."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tesseract reads the cert number off the slab photograph. Xvfb is for
      # the bid: eBay serves a headless browser a different page, so the
      # browser runs headed against a virtual display rather than headless.
      # Ubuntu runners carry neither.
      - name: Install Tesseract and a virtual display
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr xvfb

      # Card Uploader is a browser session, so even a plan needs Chromium; a
      # live run needs it twice over, since the bid goes through a browser
      # too. Cached on the lock file, as the other snipers do it.
      - name: Cache Playwright's Chromium
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # --ocr-per-day is fixed rather than a box: a planning run is a look at
      # what the sniper would do, and a dispatch left running should not be
      # able to spend without limit on reading labels. The PC run, which is
      # the one that actually bids, takes --ocr-per-day on the command line.
      # What the run knows: scheduled lots, bids in flight, what was won and
      # what the budget has left. A runner starts empty, so it is carried
      # between runs here. A cache is not a disk — on a miss the run forgets
      # what it won, which is why a live run wants a win limit and a small
      # budget.
      - name: Carry the run's state between runs
        uses: actions/cache@v4
        with:
          path: ebay-sniper-runs
          key: ebay-state-${{ github.run_id }}
          restore-keys: ebay-state-

      - name: Scan and price
        run: >-
          xvfb-run -a --server-args="-screen 0 1400x1000x24"
          npm run sniper:ebay --
          ${{ inputs.live && '--live' || '--once' }}
          --budget=${{ inputs.budget || '10000' }}
          --ocr-before=${{ inputs.ocr_before || '240' }}
          --max-wins=${{ inputs.max_wins || '0' }}
          --ocr-per-day=300
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          # Where postage is worked out to. Blank leaves calculated rates
          # unpriced and the assumption above stands in for them.
          EBAY_ZIP: ${{ inputs.zip }}
          # The signed-in session, for a runner that has none of its own.
          # Typed into the run wins over the stored secret.
          EBAY_SESSION_STATE: ${{ inputs.token || secrets.EBAY_SESSION_STATE }}
          CARDUPLOADER_EMAIL: ${{ secrets.CARDUPLOADER_EMAIL }}
          CARDUPLOADER_PASSWORD: ${{ secrets.CARDUPLOADER_PASSWORD }}
          # Through the environment rather than the command line: these carry
          # "$", commas and spaces, which a shell would eat. Blank means the
          # code's own defaults.
          TIERS_PSA: ${{ inputs.psa_tiers }}
          TIERS_CGC: ${{ inputs.cgc_tiers }}
          VALUE_BASIS: ${{ inputs.value_basis }}
          SALES_RULE: ${{ inputs.sales_rule }}

      # Every listing the scan looked at: what it is worth, what postage it
      # charges, what the run would have bid, and why anything was passed over.
      - name: Upload the bid list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebay-bids
          path: ebay-sniper-runs/ebay-bids.csv
          if-no-files-found: ignore
          retention-days: 30
