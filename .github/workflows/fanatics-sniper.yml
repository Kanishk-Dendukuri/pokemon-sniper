# Fanatics Collect sniper: find the lots worth bidding on and bid on them.
#
# One pipeline. It walks the Pokémon lots in the Weekly Auction about to close
# — later auctions are left alone — prices them by cert through Card Uploader a
# batch at a time, and puts each batch's worthy lots in front of a budget. The
# pricing carries on until every lot on the chase list has a max bid, with the
# bids watched between batches; from then on the run polls the bids it holds
# and spends what an outbid lot frees on the next lot down. Start it four or
# five hours before the close. See scripts/sniper-core.ts for the chase list, the tier table and
# the sales-history rule, scripts/sniper-book.ts for the budget and the guard
# that keeps every bid at or under the lot's max, and scripts/fanatics-sniper.ts
# and scripts/fanatics-bidder.ts for the scan, the session and the bid ladder.
# The same pipeline runs at Alt: alt-sniper.yml.
#
# The tier table — what to bid on a card by what it is worth — is typed into
# the run, one line per grader, in dollars of the card's lowest recent sale:
# "$7.5-8: flat $5, $8-10: market - $3, $10-90: 85%, $90-450: 80%" bids a flat
# $5 on a card worth $7.50–8, $3 under on one worth $8–10, 85% all-in of one
# worth $10–90 and 80% of one worth $90–450; under $7.50 and over $450 nothing is
# bid. The boxes' defaults are the code's own (DEFAULT_TIERS); the sold-report
# workflow is where a new line is tried against past auctions before it goes
# here. A line that cannot be read stops the run before anything is scanned.
#
# Nothing is bid unless the "live" box is ticked. Unticked, the run does
# everything except send a bid, and needs no Fanatics account at all.
#
# A live run needs a Fanatics session token, pasted into the token box when the
# run is started or kept in the FANATICS_REFRESH_TOKEN secret. Mint one with:
# npm run sniper -- --export-session. Note that a typed-in value is recorded on
# the run's page like any other input, where a secret is not.
#
# It reads nothing from the database and writes nothing back: the only cap on
# a card is the "max copies per card" box — four lots of it winning or won in
# this auction, whatever their grade or grader, counted by the run itself. An
# outbid copy makes room for the next one down. The one artifact is
# fanatics-bids.csv; the Actions log is the record of every bid, and the run
# summary is the page.
#
# There is no schedule: every run is started by hand. Sunday morning Pacific
# is the moment to fire it, while every lot in that evening's extended bidding
# is still open and the prices are hours old rather than days.
name: Fanatics sniper

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Budget in dollars, all-in (hammer + 20% buyer's premium)"
        type: string
        default: "100"
      live:
        description: "Place real bids (unticked: log only, nothing sent)"
        type: boolean
        default: false
      count_existing_bids:
        description: "Charge bids already on the account to the budget (unticked: the budget is on top of them)"
        type: boolean
        default: false
      psa_tiers:
        description: "PSA tier table, in dollars of the lowest recent sale: from-to: flat $N | market - $N | N%"
        type: string
        default: "$7.5-8: flat $5, $8-10: market - $3, $10-90: 85%, $90-450: 80%"
      cgc_tiers:
        description: "CGC tier table, the same way"
        type: string
        default: "$7.5-8: flat $5, $8-10: market - $3, $10-90: 77%, $90-450: 70%"
      max_copies_per_card:
        description: "Most lots of one card to hold at once, counted across every grade and both graders"
        type: string
        default: "4"
      token:
        description: "Fanatics session token (blank: the FANATICS_REFRESH_TOKEN secret)"
        type: string
        default: ""

# One run at a time: two would collide on the same Card Uploader account's
# Previous Batches page, and count the same budget twice.
concurrency:
  group: fanatics-sniper
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A live run lasts as long as it holds an open bid: through extended
    # bidding on a Sunday evening, which can be hours. 360 is the ceiling
    # GitHub-hosted runners allow, so the job is given all of it. A run cut off
    # there leaves its bids standing; the next run finds them on the account
    # and leaves them alone.
    timeout-minutes: 360

    steps:
      # A typed-in token is not a secret as far as Actions is concerned, so it is
      # masked here before anything can echo it, and the run is stopped now —
      # rather than after a two-minute scan — if a live run has no way in.
      - name: Check the way in to Fanatics
        env:
          TYPED: ${{ inputs.token }}
          STORED: ${{ secrets.FANATICS_REFRESH_TOKEN }}
        run: |
          if [ -n "$TYPED" ]; then echo "::add-mask::$TYPED"; fi
          if [ "${{ inputs.live }}" = "true" ] && [ -z "$TYPED" ] && [ -z "$STORED" ]; then
            echo "::error::A live run needs a Fanatics session. Mint one locally with: npm run sniper -- --export-session — then paste it into the token box, or store it as the FANATICS_REFRESH_TOKEN secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium is a 150 MB download every run without this. The cache is keyed
      # on the lock file, so a Playwright upgrade fetches the browser it wants;
      # the system libraries are cheap and installed either way.
      - name: Cache Playwright's Chromium
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Left alone, the dispatch form's own defaults stand: a $100 plan, no
      # bids sent, no Fanatics account touched.
      - name: Scan, price and bid
        run: >-
          npm run sniper --
          --budget=${{ inputs.budget || '100' }}
          ${{ inputs.live && '--live' || '' }}
          ${{ inputs.count_existing_bids && '--count-existing-bids' || '' }}
        env:
          CARDUPLOADER_EMAIL: ${{ secrets.CARDUPLOADER_EMAIL }}
          CARDUPLOADER_PASSWORD: ${{ secrets.CARDUPLOADER_PASSWORD }}
          # Only a live run needs this. A token is also the only way in here: a
          # runner has no screen, and Cloudflare will not draw the Fanatics
          # sign-in page for a headless browser, so an email and password
          # cannot be used. Mint one locally with: npm run sniper -- --export-session
          #
          # Typed into the run wins over the stored secret. Fanatics hands back
          # a fresh token every time one is used and the runner throws its copy
          # away, so typing this run's token in is the way to be sure it is the
          # live one; the secret is there for a run nobody is watching.
          FANATICS_REFRESH_TOKEN: ${{ inputs.token || secrets.FANATICS_REFRESH_TOKEN }}
          # The tier tables, through the environment rather than the command
          # line: the lines carry "$" and spaces, which a shell would eat.
          # Blank means the code's own defaults.
          TIERS_PSA: ${{ inputs.psa_tiers }}
          TIERS_CGC: ${{ inputs.cgc_tiers }}
          # The per-card cap, the same way. Blank means the code's own default.
          MAX_COPIES_PER_CARD: ${{ inputs.max_copies_per_card }}

      - name: Publish summary
        if: always()
        run: cat sniper-runs/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # The bid list is the one file worth keeping: every lot worth a bid, what
      # was bid, how it ended, and what a won lot cost against its market value.
      - name: Upload the bid list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanatics-bids
          path: sniper-runs/*/fanatics-bids.csv
          if-no-files-found: ignore
          retention-days: 30
